name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Gunakan JDK 21 (wajib untuk AGP 9.1.1)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 2. Pasang Gradle versi 9.3.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      # 3. Buat file debug.keystore otomatis
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 4. Siapkan file .env untuk plugin secrets
      - name: Prepare environment file
        run: |
          touch .env
          cp .env.example .env 2>/dev/null || true

      # 5. Kompilasi APK
      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace --no-daemon

      # 6. Upload file APK yang berhasil dibuat
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ML-VPN-Switcher-APK
          path: app/build/outputs/apk/debug/*.apk
